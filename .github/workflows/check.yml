name: Build and boundary checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          # GitHub's Android runner image already provides the SDK license.
          # Do not accept unrelated SDK add-on agreements on every build.
          accept-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install build SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Boundary tests
        run: |
          tools/test-protocol.sh
          tools/test-spool.sh
          python3 -m unittest discover -s rendezvous/minimal-server
          python3 -m unittest discover -s experiments/light-vibrate
          python3 -m unittest discover -s experiments/perception
      - name: Build and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :app:testProtocol :app:testSpool :app:testRestore
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-body-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
