name: Build and boundary checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # Pinned: GitHub begins migrating the `ubuntu-latest` label to Ubuntu 26 on
    # 2026-10-19, and an unpinned image would change this old-toolchain Android
    # build (sdkmanager packages, JDK 17, Gradle 8.11.1) without a source change.
    # `ubuntu-latest` resolved to ubuntu-24.04 (`ubuntu24/20261012.334`) on
    # 2026-10-16 in run 38938652837.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          # v4 defaults cmdline-tools to 20.0 (v3 used preinstalled 12.0).
          # Pinning to 16.0 fails: Google no longer hosts that download.
          # sdkmanager package installs are cmdline-tools-version independent.
          # GitHub's Android runner image already provides the SDK license.
          # Do not accept unrelated SDK add-on agreements on every build.
          accept-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Install build SDK
        # `:ble-probe` compiles against compileSdk 34, not the app's 36, so its
        # registered test task below needs that platform present. Without it the
        # module's Android sources (ProbeActivity, CapabilityReport,
        # ProbeInstrumentation) and `:ble-probe:testProbeReport` were compiled by
        # nothing in CI; the javac harness above covers only the Android-free
        # classes (ProbeReport, ProbeResult).
        run: sdkmanager 'platforms;android-36' 'platforms;android-34' 'build-tools;35.0.0'
      - name: Boundary tests
        run: |
          tools/test-protocol.sh
          tools/test-spool.sh
          # The second Gradle module is not on the `:app:` line below, so its
          # JVM regression test ran nowhere in CI: `ProbeReportTest` had a
          # registered `:ble-probe:testProbeReport` task and no caller, and the
          # then app-only check_ci_coverage.py printed GREEN anyway. This
          # harness compiles the Android-free classes with javac and runs the
          # test, so the formatter/terminal-result boundary is guarded here.
          tools/test-ble-probe.sh
          python3 -m unittest discover -s rendezvous/minimal-server
          python3 -m unittest discover -s experiments/light-vibrate
          python3 -m unittest discover -s experiments/perception
          python3 -m unittest discover -s experiments/minimal-substrate
          python3 -m unittest discover -s experiments/trial-eval
          python3 -m unittest discover -s tools
          # The reader-facing book is Markdown; a link that does not resolve is a
          # reader-visible dead end. This also catches the truncation signature
          # (a `](` with no closing `)`) that a target-resolution scan alone
          # misses -- the 2026-10-17 README defect. Runs here, not only by hand.
          python3 tools/check_docs.py
          # A test that nothing invokes is not coverage: 93909dc shipped
          # tools/check_docs.py plus its tests with no caller until e72d5f1.
          # The host tests run through three entry points (gradle tasks, the
          # tools/test-*.sh harnesses, unittest discover), so reachability is
          # not readable off this file. This fails when a test class, python
          # suite or harness is unreachable from CI.
          python3 tools/check_ci_coverage.py
      - name: Build and lint
        # The javac harness above runs ProbeReportTest without the Android SDK;
        # this is the only CI path that also compiles the module's Android
        # sources, through the registered task's dependsOn chain.
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :app:testProtocol :app:testSpool :app:testRestore :app:testExecProbe :ble-probe:testProbeReport
      # minSdk 18 (the original Note 3 baseline) cannot install an APK signed
      # only with the v2 scheme: API 18 predates it. The debug signing config
      # enables v1 and both installable artifacts carry it, but nothing checked
      # that, so a lost v1 signature (an AGP upgrade, a signing-config edit or a
      # hand-rebuilt download) would break the documented install path with CI
      # still green -- the published-payload check that follows ignores `META-INF`
      # by design and so cannot see it. `--min-sdk-version 18` states the floor
      # explicitly, so raising the manifest minimum cannot silently weaken this
      # to a v2-only check. A v2-only rebuild of the same source fails here
      # (exit 1, "Missing META-INF/MANIFEST.MF").
      - name: APKs carry the v1 signature the API 18 install path needs
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$sdk/build-tools/35.0.0/apksigner" verify --min-sdk-version 18 app/build/outputs/apk/debug/app-debug.apk
          "$sdk/build-tools/35.0.0/apksigner" verify --min-sdk-version 18 downloads/android-body-debug.apk
      - name: Published download matches the built APK
        run: python3 tools/check_published_apk.py
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-body-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
