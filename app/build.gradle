plugins { id 'com.android.application' }

android {
    namespace 'org.androidbody'
    compileSdk 36
    defaultConfig {
        applicationId 'org.androidbody'
        minSdk 18
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs {
        debug { enableV1Signing true; enableV2Signing true }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    lint { abortOnError true; warningsAsErrors false }
}

// No runtime dependencies. Test harness also runs directly with a JDK.
tasks.register('testProtocol', JavaExec) {
    dependsOn 'compileDebugUnitTestJavaWithJavac'
    classpath = files("$buildDir/intermediates/javac/debugUnitTest/compileDebugUnitTestJavaWithJavac/classes",
                      "$buildDir/intermediates/javac/debug/compileDebugJavaWithJavac/classes")
    mainClass = 'org.androidbody.ProtocolTest'
}

tasks.register('testSpool', JavaExec) {
    dependsOn 'compileDebugUnitTestJavaWithJavac'
    classpath = files("$buildDir/intermediates/javac/debugUnitTest/compileDebugUnitTestJavaWithJavac/classes",
                      "$buildDir/intermediates/javac/debug/compileDebugJavaWithJavac/classes")
    mainClass = 'org.androidbody.ObservationSpoolTest'
}
